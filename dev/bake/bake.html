<!doctype html><meta charset=utf-8><title>grip bake</title>
<!-- Runs legacy-viewer (the hand-tuned grip solver) and exports its solved upper-body poses + weapon
     models. Usage: python3 dev/bake/server.py 8130, then open http://127.0.0.1:8130/dev/bake/bake.html
     (headless: google-chrome --headless=new --dump-dom ...). Writes src/data/grips.json + assets/weapons/*.glb -->
<pre id=out>starting</pre>
<iframe id=f src="../../legacy-viewer/index.html?harness" style="width:800px;height:500px"></iframe>
<script type="module">
const log = s => document.getElementById('out').textContent += '\n' + s;
const f = document.getElementById('f');
const wait = ms => new Promise(r => setTimeout(r, ms));
const save = (path, body) => fetch('/__save?path=' + encodeURIComponent(path), { method: 'POST', body });
try {
  let w; for (let i = 0; i < 600; i++) { w = f.contentWindow; if (w.APP_EVAL && w.APP_EVAL('ready')) break; await wait(100); }
  log('legacy ready');
  const code = await (await fetch('bake-legacy.js')).text();
  const res = await w.APP_EVAL(code);
  await save('src/data/grips.json', JSON.stringify(res.json));
  for (const [id, ab] of Object.entries(res.glbs)) { await save(`assets/weapons/${id}.glb`, ab); log(`${id}.glb ${ab.byteLength}`); }
  log('summary ' + JSON.stringify(res.summary));
  log('DONE');
} catch (e) { log('ERROR ' + e.stack); }
</script>
