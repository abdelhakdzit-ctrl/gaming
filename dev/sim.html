<!doctype html><meta charset=utf-8><body><pre id=out></pre>
<iframe src="../index.html?keys=KeyW,ShiftLeft&weapon=0" style="width:1280px;height:720px"></iframe>
<script>
const f=document.querySelector('iframe');
setTimeout(()=>{const g=f.contentWindow.game;
document.getElementById('out').textContent=JSON.stringify({state:g.state,wave:g.wave,kills:g.kills,enemies:g.ais.length,pp:g.player.pos,hp:g.player.health,errs:window.__errs});},20000);
f.addEventListener('load',()=>{f.contentWindow.addEventListener('error',e=>(window.__errs=window.__errs||[]).push(e.message));});
</script>
