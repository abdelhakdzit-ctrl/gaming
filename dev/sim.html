<!doctype html><meta charset=utf-8><body><pre id=out></pre>
<iframe src="../index.html?keys=KeyW,ShiftLeft&weapon=0" style="width:1280px;height:720px"></iframe>
<script>
const f=document.querySelector('iframe');
setTimeout(async()=>{const g=f.contentWindow.game;g.paused=true;const errs=[];
try{for(let i=0;i<30*60;i++){g.update(1/30);if(i%30==0)await new Promise(r=>setTimeout(r,20));}}catch(e){errs.push(e.stack)}
const al=g.ais.filter(a=>!a.c.dead);
document.getElementById('out').textContent=JSON.stringify({state:g.state,wave:g.wave,kills:g.kills,alive:al.length,total:g.ais.length,pp:g.player.pos,hp:g.player.health,pos:al.slice(0,3).map(a=>[a.c.pos.x|0,a.c.pos.z|0,a.state||a.mode]),errs});},8000);
f.addEventListener('load',()=>{f.contentWindow.addEventListener('error',e=>(window.__errs=window.__errs||[]).push(e.message));});
</script>
